<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Color Merge</title>
  <style>
    html, body { margin: 0; height: 100%; background: #110816; color: #f5edff; font-family: system-ui, sans-serif; }
    #wrap { max-width: 420px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 22px; font-weight: 700; margin: 0 0 8px; }
    p { margin: 0 0 16px; opacity: 0.75; font-size: 14px; }
    #board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .cell {
      aspect-ratio: 1; border-radius: 14px; display: grid; place-items: center;
      font-weight: 700; font-size: 22px; background: #241436;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <h1>Color Merge</h1>
    <p>Swipe or use arrows. Combine matching tiles.</p>
    <div id="board"></div>
  </div>
  <script>
    const size = 4;
    let grid = Array.from({ length: size }, () => Array(size).fill(0));
    const board = document.getElementById("board");
    const palette = { 0: "#241436", 2: "#3b0764", 4: "#5b21b6", 8: "#7c3aed", 16: "#9333ea", 32: "#a855f7", 64: "#c084fc", 128: "#e879f9", 256: "#f0abfc", 512: "#f5d0fe" };

    function spawn() {
      const empty = [];
      for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) if (!grid[r][c]) empty.push([r, c]);
      if (!empty.length) return;
      const [r, c] = empty[Math.floor(Math.random() * empty.length)];
      grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    }
    function draw() {
      board.innerHTML = "";
      for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
        const v = grid[r][c];
        const el = document.createElement("div");
        el.className = "cell";
        el.style.background = palette[v] || "#f5edff";
        el.style.color = v >= 128 ? "#1a0a2a" : "#f5edff";
        el.textContent = v || "";
        board.appendChild(el);
      }
    }
    function slide(row) {
      const vals = row.filter(Boolean);
      for (let i = 0; i < vals.length - 1; i++) {
        if (vals[i] === vals[i + 1]) { vals[i] *= 2; vals.splice(i + 1, 1); }
      }
      while (vals.length < size) vals.push(0);
      return vals;
    }
    function rotate(times) {
      for (let t = 0; t < times; t++) {
        const n = Array.from({ length: size }, () => Array(size).fill(0));
        for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) n[c][size - 1 - r] = grid[r][c];
        grid = n;
      }
    }
    function move(dir) {
      const snap = JSON.stringify(grid);
      const rot = { left: 0, down: 1, right: 2, up: 3 }[dir];
      rotate(rot);
      grid = grid.map(slide);
      rotate((4 - rot) % 4);
      if (JSON.stringify(grid) !== snap) spawn();
      draw();
    }
    spawn(); spawn(); draw();
    addEventListener("keydown", (e) => {
      const map = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" };
      if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
    });
    let sx = 0, sy = 0;
    addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    addEventListener("touchend", (e) => {
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      if (Math.hypot(dx, dy) < 24) return;
      if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? "right" : "left");
      else move(dy > 0 ? "down" : "up");
    });
  </script>
</body>
</html>
