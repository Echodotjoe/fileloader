<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Violet Arcade</title>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #12081c;
      --panel: #1c0f2c;
      --tile: #2a1644;
      --purple: #b56bff;
      --purple-deep: #7c3aed;
      --lavender: #f3e8ff;
      --muted: #c4b5fd;
      --scan: rgba(181, 107, 255, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: radial-gradient(1200px 600px at 50% -10%, #3b1764 0%, var(--bg) 55%);
      color: var(--lavender);
      font-family: "VT323", monospace;
    }
    body::before {
      content: "";
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0, 0, 0, 0.18) 3px
      );
      z-index: 50;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 36px 20px 80px; }
    header { text-align: center; margin-bottom: 36px; }
    header p.kicker {
      font-family: "Press Start 2P", monospace;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--purple);
      margin-bottom: 14px;
    }
    h1 {
      font-family: "Press Start 2P", monospace;
      font-size: clamp(18px, 4vw, 28px);
      line-height: 1.5;
      color: var(--lavender);
      text-shadow: 0 0 18px rgba(181, 107, 255, 0.55);
    }
    .sub {
      margin-top: 12px;
      font-size: 22px;
      color: var(--muted);
    }
    .toolbar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 22px 0 8px;
      flex-wrap: wrap;
    }
    .ghost {
      font-family: "Press Start 2P", monospace;
      font-size: 10px;
      color: var(--lavender);
      background: transparent;
      border: 2px solid var(--purple);
      padding: 12px 16px;
      border-radius: 999px;
      cursor: pointer;
    }
    .ghost:hover { background: rgba(181, 107, 255, 0.15); }
    .status {
      text-align: center;
      font-size: 20px;
      color: var(--muted);
      min-height: 28px;
      margin-bottom: 18px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 22px;
    }
    .card {
      background: var(--panel);
      border: 2px solid rgba(181, 107, 255, 0.28);
      border-radius: 32px;
      padding: 22px 16px 18px;
      text-align: center;
      box-shadow: 0 10px 0 #090412, 0 0 24px rgba(124, 58, 237, 0.25);
    }
    .icon {
      width: 112px;
      height: 112px;
      margin: 0 auto 14px;
      border-radius: 28px;
      background: linear-gradient(180deg, var(--purple) 0%, var(--purple-deep) 100%);
      color: #1a0a2a;
      display: grid;
      place-items: center;
      font-family: "Press Start 2P", monospace;
      font-size: 18px;
      box-shadow: inset 0 -8px 0 rgba(0, 0, 0, 0.25), 0 8px 0 rgba(0, 0, 0, 0.35);
    }
    .name {
      font-size: 26px;
      line-height: 1.15;
      min-height: 52px;
      word-break: break-word;
    }
    .kind {
      font-size: 16px;
      letter-spacing: 2px;
      color: var(--muted);
      margin: 6px 0 14px;
      text-transform: uppercase;
    }
    .play {
      width: 100%;
      border: 0;
      cursor: pointer;
      font-family: "Press Start 2P", monospace;
      font-size: 11px;
      padding: 14px 10px;
      border-radius: 999px;
      background: var(--purple);
      color: #1a0a2a;
      box-shadow: 0 4px 0 #5b21b6;
    }
    .play:active { transform: translateY(2px); box-shadow: 0 2px 0 #5b21b6; }
    .empty {
      grid-column: 1 / -1;
      border: 2px dashed rgba(181, 107, 255, 0.4);
      border-radius: 28px;
      padding: 40px 18px;
      text-align: center;
      font-size: 22px;
      color: var(--muted);
    }
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8, 3, 16, 0.94);
      z-index: 80;
      flex-direction: column;
      padding: 14px;
    }
    #overlay.on { display: flex; }
    .player-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto 10px;
    }
    #player-title { font-size: 28px; }
    .close {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--purple);
      background: transparent;
      color: var(--lavender);
      font-size: 22px;
      cursor: pointer;
    }
    #stage {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      background: #090412;
      border: 2px solid rgba(181, 107, 255, 0.35);
      border-radius: 18px;
      overflow: hidden;
    }
    #stage iframe, #stage ruffle-player {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .drop-veil {
      display: none;
      position: fixed;
      inset: 12px;
      z-index: 70;
      border: 3px dashed var(--purple);
      border-radius: 24px;
      background: rgba(18, 8, 28, 0.8);
      place-items: center;
      font-family: "Press Start 2P", monospace;
      font-size: 14px;
    }
    body.drag .drop-veil { display: grid; }
  </style>
</head>
<body>
  <div class="drop-veil">DROP HTML OR SWF</div>
  <div class="wrap">
    <header>
      <p class="kicker">INSERT GAME</p>
      <h1>VIOLET ARCADE</h1>
      <p class="sub">Plays HTML and SWF files from this same folder.</p>
      <div class="toolbar">
        <button class="ghost" id="rescan" type="button">Rescan folder</button>
        <button class="ghost" id="openlocal" type="button">Open local files</button>
      </div>
      <input id="picker" type="file" accept=".html,.htm,.swf" multiple hidden />
    </header>
    <p class="status" id="status">Scanning this folder…</p>
    <div class="grid" id="grid"></div>
  </div>

  <div id="overlay">
    <div class="player-bar">
      <div id="player-title">Playing</div>
      <button class="close" id="close" type="button" aria-label="Close">✕</button>
    </div>
    <div id="stage"></div>
  </div>

  <script>
    const SKIP = new Set(["index.html", "violet-arcade.html"]);
    const games = [];
    const grid = document.getElementById("grid");
    const status = document.getElementById("status");
    const overlay = document.getElementById("overlay");
    const stage = document.getElementById("stage");
    const playerTitle = document.getElementById("player-title");
    const picker = document.getElementById("picker");

    function pretty(filename) {
      return filename
        .replace(/\.(html?|swf)$/i, "")
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, (c) => c.toUpperCase());
    }

    function typeOf(name) {
      if (/\.swf$/i.test(name)) return "swf";
      if (/\.html?$/i.test(name)) return "html";
      return null;
    }

    function addGame(entry) {
      const key = entry.file.toLowerCase();
      if (games.some((g) => g.file.toLowerCase() === key || g.id === entry.id)) return;
      games.push(entry);
    }

    function render() {
      if (!games.length) {
        grid.innerHTML = `<div class="empty">No HTML or SWF files found next to this page.<br/>Put games in this folder, or drop files here.</div>`;
        return;
      }
      games.sort((a, b) => a.name.localeCompare(b.name));
      grid.innerHTML = games.map((g, i) => `
        <article class="card">
          <div class="icon">${g.type === "swf" ? "SWF" : "HTML"}</div>
          <div class="name">${g.name}</div>
          <div class="kind">${g.type}${g.source === "local" ? " · local" : ""}</div>
          <button class="play" type="button" data-i="${i}">PLAY</button>
        </article>
      `).join("");
    }

    async function scanFolder() {
      status.textContent = "Scanning this folder…";
      const found = [];
      const bases = [
        "./",
        new URL(".", location.href).href,
      ];
      for (const base of bases) {
        try {
          const res = await fetch(base, { cache: "no-store" });
          if (!res.ok) continue;
          const html = await res.text();
          const hrefs = [...html.matchAll(/href=["']([^"']+)["']/gi)].map((m) => m[1]);
          const extras = [...html.matchAll(/>\s*([^\s<>]+\.(?:html?|swf))\s*</gi)].map((m) => m[1]);
          for (const raw of [...hrefs, ...extras]) {
            let name = raw.split("?")[0].split("#")[0];
            try { name = decodeURIComponent(name); } catch {}
            name = name.replace(/\\/g, "/").split("/").pop();
            if (!name || SKIP.has(name.toLowerCase()) || name.startsWith(".")) continue;
            const type = typeOf(name);
            if (!type) continue;
            found.push({
              id: "dir:" + name,
              name: pretty(name),
              file: name,
              type,
              source: "folder",
            });
          }
          if (found.length) break;
        } catch {}
      }

      const current = location.pathname.split("/").pop() || "index.html";
      SKIP.add(current.toLowerCase());

      for (const g of found) addGame(g);
      status.textContent = games.length
        ? games.filter((g) => g.source === "folder").length + " file(s) in this folder"
        : "Folder listing blocked — drop files or use Open local files";
      render();
    }

    function play(i) {
      const g = games[i];
      if (!g) return;
      playerTitle.textContent = g.name;
      stage.innerHTML = "";
      overlay.classList.add("on");
      if (g.type === "html") {
        const iframe = document.createElement("iframe");
        iframe.src = g.file;
        iframe.title = g.name;
        iframe.allow = "fullscreen; autoplay; gamepad";
        stage.appendChild(iframe);
        return;
      }
      if (!window.RufflePlayer) {
        stage.innerHTML = `<p style="padding:24px;font-size:22px">Could not load the Flash player (Ruffle).</p>`;
        return;
      }
      const player = window.RufflePlayer.newest().createPlayer();
      player.style.width = "100%";
      player.style.height = "100%";
      stage.appendChild(player);
      player.load(g.file);
    }

    function closePlayer() {
      overlay.classList.remove("on");
      stage.innerHTML = "";
    }

    function addLocalFiles(list) {
      let n = 0;
      for (const file of list) {
        const type = typeOf(file.name);
        if (!type) continue;
        addGame({
          id: "local:" + file.name + ":" + file.size + ":" + file.lastModified,
          name: pretty(file.name),
          file: URL.createObjectURL(file),
          type,
          source: "local",
        });
        n += 1;
      }
      if (n) {
        status.textContent = "Added " + n + " local file(s)";
        render();
      }
    }

    grid.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-i]");
      if (btn) play(Number(btn.dataset.i));
    });
    document.getElementById("close").onclick = closePlayer;
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePlayer(); });
    document.getElementById("rescan").onclick = scanFolder;
    document.getElementById("openlocal").onclick = () => picker.click();
    picker.onchange = () => {
      addLocalFiles(picker.files);
      picker.value = "";
    };
    document.addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("drag"); });
    document.addEventListener("dragleave", () => document.body.classList.remove("drag"));
    document.addEventListener("drop", (e) => {
      e.preventDefault();
      document.body.classList.remove("drag");
      if (e.dataTransfer.files.length) addLocalFiles(e.dataTransfer.files);
    });

    scanFolder();
  </script>
</body>
</html>
